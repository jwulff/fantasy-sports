[project]
name = "fantasy-sports"
version = "0.1.0.dev0"
description = "Agent-native CLI for fantasy sports leagues — ESPN first, provider-agnostic by construction."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Wulff", email = "john@johnwulff.com" }]
keywords = ["fantasy-football", "espn", "fantasy-sports", "cli", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]

# ADR-0008 budget: at most five direct runtime dependencies. `rich` is used for
# table rendering but arrives through `typer`; `requests` is listed explicitly
# because we intercept its responses for rate limiting and caching rather than
# merely inheriting it from `espn-api`.
dependencies = [
    "espn-api>=0.45.0",
    "typer>=0.15.1",
    "requests>=2.32.3",
    "keyring>=25.5.0",
    "tomli-w>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/jwulff/fantasy-sports"
Repository = "https://github.com/jwulff/fantasy-sports"
Issues = "https://github.com/jwulff/fantasy-sports/issues"

[project.scripts]
fantasy-sports = "fantasy_sports.cli.app:main_entry"
fantasy = "fantasy_sports.cli.app:main_entry"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-socket>=0.7.0",
    "pytest-json-report>=1.5.0",
    "vcrpy>=6.0.2",
    "pytest-recording>=0.13.2",
    "requests-mock>=1.12.1",
    "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_sports"]

[tool.ruff]
line-length = 100
target-version = "py312"
# `ruff format` rewrites Python code blocks inside Markdown. The research
# briefs and ADRs are primary-source records — quoted upstream code in them
# must stay byte-identical to what was actually read.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
markers = [
    "live: hits real ESPN with real credentials; excluded from normal CI (see tests/live/)",
]

[tool.coverage.run]
source = ["src/fantasy_sports"]
branch = true
omit = ["*/live/*"]

[tool.coverage.report]
fail_under = 90
